[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinlackey"
version = "0.1.0"
description = "Official Python client for CoinLackey Real-Time Crypto Derivatives & Macro Terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "CoinLackey", email = "contact@coinlackey.com" }
]
keywords = [
    "crypto",
    "derivatives",
    "funding-rates",
    "open-interest",
    "liquidations",
    "terminal",
    "trading",
    "binance",
    "bybit",
    "coinglass-alternative"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://coinlackey.com"
"Live Terminal" = "https://coinlackey.com"
"Asset Intelligence" = "https://coinlackey.com/assets"
"Documentation" = "https://coinlackey.com/docs"
"Source Code" = "https://github.com/smilingbuddhaextracts-eng/coinlackey-coinlackey-python"
"Bug Tracker" = "https://github.com/smilingbuddhaextracts-eng/coinlackey-coinlackey-python/issues"
